name: GitHub Trophies

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/trophies.yml

permissions:
  contents: read

concurrency:
  group: github-trophies
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate trophies without the public image server
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: bos-hieu
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: assets/trophies.svg
          theme: onedark

      - uses: actions/upload-artifact@v4
        with:
          name: trophies
          path: assets/trophies.svg
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: trophies
          path: assets

      - name: Validate image and update README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          image = Path("assets/trophies.svg")
          root = ET.parse(image).getroot()
          if root.tag != "{http://www.w3.org/2000/svg}svg":
              raise SystemExit("Trophy generator did not produce an SVG")
          if not any(node.tag.endswith("}text") for node in root.iter()):
              raise SystemExit("Trophy SVG has no trophy labels")

          readme = Path("README.md")
          content, count = re.subn(
              r"(## 🏆 GitHub Trophies\n)[^\n]+",
              r"\1![GitHub trophies for bos-hieu](assets/trophies.svg)",
              readme.read_text(),
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the trophies section")
          readme.write_text(content)
          PY

      - name: Save generated trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub trophies"
            git push
          fi
